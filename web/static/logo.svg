<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="溯痕 Trail">
  <title>溯痕 Trail — CyberstrikeAI 蓝队版</title>
  <defs>
    <linearGradient id="trailLens" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b1120"/>
  <!-- 放大镜：追溯 -->
  <g fill="none" stroke="url(#trailLens)" stroke-linecap="round">
    <circle cx="27" cy="27" r="15.5" stroke-width="3.2"/>
    <path d="M38.5 38.5 L50 50" stroke-width="4.2"/>
  </g>
  <!-- 镜内指纹涡纹：痕迹 -->
  <g fill="none" stroke="url(#trailLens)" stroke-linecap="round" transform="rotate(-14 27 27)">
    <ellipse cx="27" cy="27" rx="9.6" ry="11.4" stroke-width="2.1"/>
    <ellipse cx="27" cy="27" rx="5.8" ry="7.2" stroke-width="2.1"/>
    <ellipse cx="27" cy="27" rx="2.2" ry="3" stroke-width="2.1"/>
  </g>
</svg>
